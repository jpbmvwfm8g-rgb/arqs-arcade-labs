<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARQS Project Cost Estimator Lab</title>
<style>
body { background: #111; color: #eee; font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
label { display: block; margin: 12px 0 4px; }
input, select { width: 100%; padding: 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; }
button { margin-top: 20px; padding: 10px 20px; background: #0a84ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
.result { margin-top: 20px; padding: 16px; background: #222; border-radius: 8px; }
</style>
</head>
<body>
<h1>ARQS Project Cost Estimator Lab</h1>
<p>Educational mini-app for rough commercial / healthcare project cost ranges. Not a formal estimate.</p>
<label>Project Type</label>
<select id="type">
  <option value="commercial">Commercial</option>
  <option value="healthcare">Healthcare</option>
  <option value="industrial">Industrial-Energy</option>
  <option value="residential">Residential</option>
</select>
<label>Square Footage</label>
<input type="number" id="sqft" value="5000" min="100">
<label>Complexity (1-5)</label>
<input type="range" id="complexity" min="1" max="5" value="3" oninput="this.nextElementSibling.value=this.value">
<output>3</output>
<button onclick="estimate()">Calculate Range</button>
<div class="result" id="out">Enter details and calculate.</div>
<script>
const rates = {commercial: 250, healthcare: 450, industrial: 320, residential: 180};
function estimate() {
  const type = document.getElementById('type').value;
  const sqft = +document.getElementById('sqft').value;
  const comp = +document.getElementById('complexity').value;
  const base = rates[type] * sqft;
  const factor = 0.8 + (comp - 1) * 0.15;
  const low = Math.round(base * factor * 0.85);
  const high = Math.round(base * factor * 1.25);
  document.getElementById('out').innerHTML = `<strong>Estimated Range:</strong><br>$${low.toLocaleString()} – $${high.toLocaleString()} USD<br><small>Base rate $${rates[type]}/sf × complexity factor. Educational only.</small>`;
}
</script>
</body>
</html>
