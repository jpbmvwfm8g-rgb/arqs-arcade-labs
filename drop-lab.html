<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARQS Drop Lab</title>
<style>
body { background: #111; color: #ff0; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
canvas { border: 2px solid #ff0; background: #000; }
</style>
</head>
<body>
<h1>ARQS Drop Lab</h1>
<div>Score: <span id="score">0</span> | Lines: <span id="lines">0</span> | Best: <span id="best">0</span></div>
<canvas id="game" width="300" height="600"></canvas>
<p>Arrow keys to move/rotate, Down to drop faster. Stack the blocks and clear lines!</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const COLS = 10, ROWS = 20, BLOCK = 30;
let board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
let score = 0, lines = 0;
let best = parseInt(localStorage.getItem('arqsDropBest') || '0');
document.getElementById('best').textContent = best;
let current = null, next = null;
const shapes = [
  [[1,1,1,1]], // I
  [[1,1],[1,1]], // O
  [[0,1,0],[1,1,1]], // T
  [[1,0],[1,0],[1,1]], // L
  [[0,1],[0,1],[1,1]], // J
  [[1,1,0],[0,1,1]], // S
  [[0,1,1],[1,1,0]] // Z
];
const colors = ['#0f0','#ff0','#f0f','#0ff','#f80','#f00','#08f'];

function randomShape() {
  const i = Math.floor(Math.random() * shapes.length);
  return {shape: shapes[i], color: colors[i], x: 3, y: 0};
}

function spawn() {
  current = next || randomShape();
  next = randomShape();
  if (collision(current.shape, current.x, current.y)) {
    alert('Game Over! Score: ' + score);
    document.location.reload();
  }
}
spawn();

function collision(shape, x, y) {
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (shape[r][c]) {
        const nx = x + c, ny = y + r;
        if (nx < 0 || nx >= COLS || ny >= ROWS || (ny >= 0 && board[ny][nx])) return true;
      }
    }
  }
  return false;
}

function merge() {
  current.shape.forEach((row, r) => {
    row.forEach((val, c) => {
      if (val && current.y + r >= 0) board[current.y + r][current.x + c] = current.color;
    });
  });
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(cell => cell)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(0));
      cleared++;
      r++;
    }
  }
  if (cleared) {
    lines += cleared;
    score += cleared * 100 * cleared; // bonus for multi
    document.getElementById('score').textContent = score;
    document.getElementById('lines').textContent = lines;
    if (score > best) {
      best = score;
      localStorage.setItem('arqsDropBest', best);
      document.getElementById('best').textContent = best;
    }
  }
}

function rotate(shape) {
  return shape[0].map((_, i) => shape.map(row => row[i]).reverse());
}

let dropCounter = 0;
const dropInterval = 30;

function update() {
  dropCounter++;
  if (dropCounter > dropInterval) {
    if (!collision(current.shape, current.x, current.y + 1)) {
      current.y++;
    } else {
      merge();
      clearLines();
      spawn();
    }
    dropCounter = 0;
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' && !collision(current.shape, current.x - 1, current.y)) current.x--;
  if (e.key === 'ArrowRight' && !collision(current.shape, current.x + 1, current.y)) current.x++;
  if (e.key === 'ArrowDown') {
    if (!collision(current.shape, current.x, current.y + 1)) current.y++;
    dropCounter = 0;
  }
  if (e.key === 'ArrowUp' || e.key === ' ') {
    const rotated = rotate(current.shape);
    if (!collision(rotated, current.x, current.y)) current.shape = rotated;
  }
});

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Board
  board.forEach((row, r) => {
    row.forEach((color, c) => {
      if (color) {
        ctx.fillStyle = color;
        ctx.fillRect(c * BLOCK, r * BLOCK, BLOCK - 1, BLOCK - 1);
      }
    });
  });
  // Current
  current.shape.forEach((row, r) => {
    row.forEach((val, c) => {
      if (val) {
        ctx.fillStyle = current.color;
        ctx.fillRect((current.x + c) * BLOCK, (current.y + r) * BLOCK, BLOCK - 1, BLOCK - 1);
      }
    });
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
