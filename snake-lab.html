<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Lab | ARQS Arcade Labs</title>
<style>
body { background: #0a0a0a; color: #0f0; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; }
canvas { border: 2px solid #0f0; background: #111; }
#score, #high { margin: 10px; }
button { background: #0f0; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin: 5px; }
</style>
</head>
<body>
<h1>Snake Lab</h1>
<p>Classic snake. Arrow keys to move. Eat food, grow, avoid walls and self.</p>
<div id="score">Score: 0</div>
<div id="high">High Score: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<button onclick="startGame()">Start / Restart</button>
<button onclick="window.location.href='index.html'">Back to Labs</button>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const grid = 20;
let snake = [{x: 10, y: 10}];
let food = {x: 15, y: 15};
let dx = 1, dy = 0;
let score = 0;
let high = parseInt(localStorage.getItem('snake-high') || '0');
let gameLoop;
let running = false;

document.getElementById('high').textContent = 'High Score: ' + high;

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0f0';
  snake.forEach(s => ctx.fillRect(s.x * grid, s.y * grid, grid-2, grid-2));
  ctx.fillStyle = '#f00';
  ctx.fillRect(food.x * grid, food.y * grid, grid-2, grid-2);
}

function update() {
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20 || snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = 'Score: ' + score;
    if (score > high) {
      high = score;
      localStorage.setItem('snake-high', high);
      document.getElementById('high').textContent = 'High Score: ' + high;
    }
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function placeFood() {
  food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
  if (snake.some(s => s.x === food.x && s.y === food.y)) placeFood();
}

function startGame() {
  if (running) clearInterval(gameLoop);
  snake = [{x: 10, y: 10}];
  dx = 1; dy = 0;
  score = 0;
  document.getElementById('score').textContent = 'Score: 0';
  placeFood();
  running = true;
  gameLoop = setInterval(update, 100);
  draw();
}

function endGame() {
  clearInterval(gameLoop);
  running = false;
  alert('Game Over! Score: ' + score);
}

document.addEventListener('keydown', e => {
  if (!running) return;
  switch(e.key) {
    case 'ArrowUp': if (dy === 0) { dx = 0; dy = -1; } break;
    case 'ArrowDown': if (dy === 0) { dx = 0; dy = 1; } break;
    case 'ArrowLeft': if (dx === 0) { dx = -1; dy = 0; } break;
    case 'ArrowRight': if (dx === 0) { dx = 1; dy = 0; } break;
  }
});

draw();
</script>
</body>
</html>
