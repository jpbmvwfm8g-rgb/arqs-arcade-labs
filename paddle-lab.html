<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARQS Paddle Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
canvas { border: 2px solid #0f0; background: #000; max-width: 100%; height: auto; touch-action: none; }
.hud { margin: 10px; font-size: 1.1em; }
</style>
</head>
<body>
<h1>ARQS Paddle Lab</h1>
<div class="hud">Score: <span id="score">0</span> | Lives: <span id="lives">3</span> | Best: <span id="best">0</span> | Level: <span id="level">1</span></div>
<canvas id="game" width="800" height="500"></canvas>
<p>Use mouse, arrow keys / W S / A D, or touch to move paddle. Keep the ball in play! Speed increases with score.</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let ball = {x: 400, y: 250, dx: 5, dy: 4, r: 10};
let paddle = {x: 350, y: 470, w: 100, h: 15, speed: 8};
let score = 0;
let lives = 3;
let level = 1;
let best = parseInt(localStorage.getItem('arqsPaddleBest') || '0');
document.getElementById('best').textContent = best;
document.getElementById('lives').textContent = lives;
document.getElementById('level').textContent = level;
let keys = {};

function resetBall() {
  ball = {x: 400, y: 250, dx: (5 + level) * (Math.random() > 0.5 ? 1 : -1), dy: 4 + level * 0.5, r: 10};
}

document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

function movePaddleTo(clientX) {
  const rect = canvas.getBoundingClientRect();
  paddle.x = clientX - rect.left - paddle.w / 2;
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;
}

canvas.addEventListener('mousemove', e => movePaddleTo(e.clientX));
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length) movePaddleTo(e.touches[0].clientX);
}, {passive: false});

function update() {
  // Paddle keyboard
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;

  ball.x += ball.dx;
  ball.y += ball.dy;

  // Walls
  if (ball.x - ball.r < 0 || ball.x + ball.r > canvas.width) ball.dx *= -1;
  if (ball.y - ball.r < 0) ball.dy *= -1;

  // Paddle collision
  if (ball.y + ball.r > paddle.y && ball.y < paddle.y + paddle.h && ball.x > paddle.x && ball.x < paddle.x + paddle.w && ball.dy > 0) {
    ball.dy *= -1;
    const hitPos = (ball.x - paddle.x) / paddle.w - 0.5;
    ball.dx += hitPos * 4;
    score++;
    document.getElementById('score').textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('arqsPaddleBest', best);
      document.getElementById('best').textContent = best;
    }
    // Level up every 5 points
    if (score % 5 === 0) {
      level++;
      document.getElementById('level').textContent = level;
      ball.dx *= 1.05;
      ball.dy *= 1.05;
    }
  }

  // Miss
  if (ball.y + ball.r > canvas.height) {
    lives--;
    document.getElementById('lives').textContent = lives;
    if (lives <= 0) {
      alert('Game Over! Final Score: ' + score);
      score = 0;
      lives = 3;
      level = 1;
      document.getElementById('score').textContent = score;
      document.getElementById('lives').textContent = lives;
      document.getElementById('level').textContent = level;
    }
    resetBall();
  }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#0f0';
  ctx.fill();
  // Paddle
  ctx.fillStyle = '#0f0';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
resetBall();
loop();
</script>
</body>
</html>
