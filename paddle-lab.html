<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARQS Paddle Lab</title>
<style>
body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
canvas { border: 2px solid #0f0; background: #000; max-width: 100%; height: auto; }
.hud { margin: 10px; font-size: 1.2em; }
#status { color: #ff0; }
</style>
</head>
<body>
<h1>ARQS Paddle Lab</h1>
<div class="hud">Score: <span id="score">0</span> | Best: <span id="best">0</span> | Lives: <span id="lives">3</span> <span id="status"></span></div>
<canvas id="game" width="800" height="500"></canvas>
<p>Mouse / Touch / Arrow keys / A D to move paddle. Space or P to pause. Keep the ball in play!</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let ball = {x: 400, y: 250, dx: 5, dy: 4, r: 10};
let paddle = {x: 350, y: 470, w: 100, h: 15, speed: 8};
let score = 0;
let lives = 3;
let best = parseInt(localStorage.getItem('arqsPaddleBest') || '0');
let paused = false;
let gameOver = false;
document.getElementById('best').textContent = best;
document.getElementById('lives').textContent = lives;
let keys = {};

// Simple Web Audio beeps (no external assets)
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function playBeep(freq = 440, duration = 0.1, type = 'square') {
  if (!audioCtx) audioCtx = new AudioCtx();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'p' || e.key === 'P') {
    e.preventDefault();
    if (!gameOver) {
      paused = !paused;
      document.getElementById('status').textContent = paused ? 'PAUSED' : '';
      if (!paused && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
  }
});
document.addEventListener('keyup', e => keys[e.key] = false);

function movePaddleTo(clientX) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  paddle.x = (clientX - rect.left) * scaleX - paddle.w / 2;
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;
}

canvas.addEventListener('mousemove', e => { if (!paused && !gameOver) movePaddleTo(e.clientX); });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!paused && !gameOver && e.touches.length) movePaddleTo(e.touches[0].clientX);
}, {passive: false});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!paused && !gameOver && e.touches.length) movePaddleTo(e.touches[0].clientX);
}, {passive: false});

function resetBall() {
  ball = {x: 400, y: 250, dx: 5 * (Math.random() > 0.5 ? 1 : -1), dy: 4, r: 10};
}

function update() {
  if (paused || gameOver) return;

  // Paddle keyboard
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;

  ball.x += ball.dx;
  ball.y += ball.dy;

  // Walls
  if (ball.x - ball.r < 0 || ball.x + ball.r > canvas.width) {
    ball.dx *= -1;
    playBeep(300, 0.05);
  }
  if (ball.y - ball.r < 0) {
    ball.dy *= -1;
    playBeep(350, 0.05);
  }

  // Paddle collision
  if (ball.y + ball.r > paddle.y && ball.y + ball.r < paddle.y + paddle.h + 5 && ball.x > paddle.x && ball.x < paddle.x + paddle.w && ball.dy > 0) {
    ball.dy *= -1;
    const hitPos = (ball.x - paddle.x) / paddle.w - 0.5;
    ball.dx += hitPos * 4;
    // Cap speed
    const speed = Math.hypot(ball.dx, ball.dy);
    if (speed > 15) {
      ball.dx *= 15 / speed;
      ball.dy *= 15 / speed;
    }
    score++;
    document.getElementById('score').textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('arqsPaddleBest', best);
      document.getElementById('best').textContent = best;
    }
    playBeep(600, 0.08);
    // Slight speed up
    ball.dx *= 1.015;
    ball.dy *= 1.015;
  }

  // Miss
  if (ball.y + ball.r > canvas.height) {
    lives--;
    document.getElementById('lives').textContent = lives;
    playBeep(150, 0.2, 'sawtooth');
    if (lives <= 0) {
      gameOver = true;
      document.getElementById('status').textContent = 'GAME OVER - Refresh to restart';
    } else {
      resetBall();
    }
  }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#0f0';
  ctx.fill();
  // Paddle
  ctx.fillStyle = '#0f0';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  // Center line
  ctx.strokeStyle = '#333';
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(0, canvas.height / 2);
  ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.stroke();
  ctx.setLineDash([]);

  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff0';
    ctx.font = '40px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
  }
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f00';
    ctx.font = '40px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = '#0f0';
    ctx.font = '20px monospace';
    ctx.fillText('Score: ' + score + ' | Best: ' + best, canvas.width / 2, canvas.height / 2 + 20);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
