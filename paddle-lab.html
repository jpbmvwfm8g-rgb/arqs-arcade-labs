<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARQS Paddle Lab</title>
<style>
body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
canvas { border: 2px solid #0f0; background: #000; }
.hud { margin: 10px; }
</style>
</head>
<body>
<h1>ARQS Paddle Lab</h1>
<div class="hud">Score: <span id="score">0</span> | Best: <span id="best">0</span></div>
<canvas id="game" width="800" height="500"></canvas>
<p>Use mouse or arrow keys / W S to move paddle. Keep the ball in play!</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let ball = {x: 400, y: 250, dx: 5, dy: 4, r: 10};
let paddle = {x: 350, y: 470, w: 100, h: 15, speed: 8};
let score = 0;
let best = 0;
try { best = parseInt(localStorage.getItem('arqsPaddleBest') || '0') || 0; } catch (e) {}
document.getElementById('best').textContent = best;
let keys = {};

let audioCtx = null;
function beep(freq, dur, type = 'square', vol = 0.1) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  paddle.x = e.clientX - rect.left - paddle.w / 2;
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;
});

function update() {
  // Paddle keyboard
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;

  ball.x += ball.dx;
  ball.y += ball.dy;

  // Walls
  if (ball.x - ball.r < 0 || ball.x + ball.r > canvas.width) { ball.dx *= -1; beep(300, 0.05); }
  if (ball.y - ball.r < 0) { ball.dy *= -1; beep(300, 0.05); }

  // Paddle collision
  if (ball.y + ball.r > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.w && ball.dy > 0) {
    ball.dy *= -1;
    // Add some spin based on hit position
    const hitPos = (ball.x - paddle.x) / paddle.w - 0.5;
    ball.dx += hitPos * 3;
    score++;
    document.getElementById('score').textContent = score;
    beep(520, 0.08);
    // Speed up slightly
    ball.dx *= 1.02;
    ball.dy *= 1.02;
  }

  // Miss
  if (ball.y + ball.r > canvas.height) {
    if (score > best) {
      best = score;
      try { localStorage.setItem('arqsPaddleBest', best); } catch (e) {}
      document.getElementById('best').textContent = best;
    }
    beep(150, 0.4, 'sawtooth');
    score = 0;
    document.getElementById('score').textContent = score;
    ball = {x: 400, y: 250, dx: 5 * (Math.random() > 0.5 ? 1 : -1), dy: 4, r: 10};
  }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#0f0';
  ctx.fill();
  // Paddle
  ctx.fillStyle = '#0f0';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  // Center line optional
  ctx.strokeStyle = '#333';
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(0, canvas.height / 2);
  ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.stroke();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
