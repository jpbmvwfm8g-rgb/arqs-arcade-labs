<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARQS Paddle Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
canvas { border: 2px solid #0f0; background: #000; max-width: 100%; touch-action: none; }
.hud { margin: 10px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
button { background: #0f0; color: #000; border: none; padding: 8px 16px; font-family: monospace; cursor: pointer; }
button:hover { background: #0a0; }
</style>
</head>
<body>
<h1>ARQS Paddle Lab</h1>
<div class="hud">
  <div>Score: <span id="score">0</span></div>
  <div>Level: <span id="level">1</span></div>
  <div>Best: <span id="best">0</span></div>
  <button id="pauseBtn">Pause</button>
</div>
<canvas id="game" width="800" height="500"></canvas>
<p>Mouse / touch / arrow keys / WASD. Keep the ball in play! Speed increases each level.</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let ball = {x: 400, y: 250, dx: 5, dy: 4, r: 10};
let paddle = {x: 350, y: 470, w: 120, h: 15, speed: 8};
let score = 0;
let level = 1;
let best = parseInt(localStorage.getItem('arqsPaddleBest') || '0');
document.getElementById('best').textContent = best;
let keys = {};
let paused = false;
let running = true;

document.getElementById('pauseBtn').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
});

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'p' || e.key === 'P') {
    paused = !paused;
    document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
  }
});
document.addEventListener('keyup', e => keys[e.key] = false);

function setPaddleFromEvent(clientX) {
  const rect = canvas.getBoundingClientRect();
  const scale = canvas.width / rect.width;
  paddle.x = (clientX - rect.left) * scale - paddle.w / 2;
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;
}
canvas.addEventListener('mousemove', e => setPaddleFromEvent(e.clientX));
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  setPaddleFromEvent(e.touches[0].clientX);
}, {passive: false});

function update() {
  if (paused || !running) return;
  // Paddle keyboard
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;

  ball.x += ball.dx;
  ball.y += ball.dy;

  // Walls
  if (ball.x - ball.r < 0 || ball.x + ball.r > canvas.width) ball.dx *= -1;
  if (ball.y - ball.r < 0) ball.dy *= -1;

  // Paddle collision
  if (ball.y + ball.r > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.w && ball.dy > 0) {
    ball.dy *= -1;
    const hitPos = (ball.x - paddle.x) / paddle.w - 0.5;
    ball.dx += hitPos * 4;
    score += level;
    document.getElementById('score').textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('arqsPaddleBest', best);
      document.getElementById('best').textContent = best;
    }
    // Level up every 10 points
    if (score > 0 && score % 10 === 0) {
      level++;
      document.getElementById('level').textContent = level;
      ball.dx *= 1.1;
      ball.dy *= 1.1;
    }
  }

  // Miss
  if (ball.y + ball.r > canvas.height) {
    score = 0;
    level = 1;
    document.getElementById('score').textContent = score;
    document.getElementById('level').textContent = level;
    ball = {x: 400, y: 250, dx: 5 * (Math.random() > 0.5 ? 1 : -1), dy: 4, r: 10};
  }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#0f0';
  ctx.fill();
  // Paddle
  ctx.fillStyle = '#0f0';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  // Center line
  ctx.strokeStyle = '#333';
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(0, canvas.height / 2);
  ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.stroke();
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0f0';
    ctx.font = '40px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width/2, canvas.height/2);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
